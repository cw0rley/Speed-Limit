name = "speed-limit-proxy"
main = "worker.js"
compatibility_date = "2025-09-01"
workers_dev = true

# Secrets (never in this file):
#   npx wrangler secret put TOMTOM_API_KEY
# The old HERE_API_KEY secret is unused (/here-route returns 410); delete it with
#   npx wrangler secret delete HERE_API_KEY

# D1 database: TomTom call counters (daily cap, per-IP cap) + the speed-limit
# cache. Created once with:
#   npx wrangler d1 create speed-limit-usage
# The Worker creates its tables itself on first use.
[[d1_databases]]
binding = "USAGE_DB"
database_name = "speed-limit-usage"
database_id = "a75a26ec-f2db-43b4-bacb-856275688cd2"

# Daily clean-up of per-IP rate-limit rows (kept at most ~48 h). Cron
# triggers are included in the Workers Free plan.
[triggers]
crons = ["17 3 * * *"]

[vars]
# KILL SWITCH. "false" = TomTom is never called (/limit returns 503).
# ON since 2026-09-17 for TEST BUILDS ONLY (TOMTOM_ACCESS = "test", free
# evaluation plan). Before any store release uses TomTom: written licensing
# answer from TomTom (inquiry sent 2026-09-17) and TOMTOM_ACCESS = "subscribers".
TOMTOM_ENABLED = "true"
# Who may use /limit: "test" = only requests with X-Client-Token matching the
# TEST_CLIENT_TOKEN secret (TestFlight builds from the `testflight` profile).
TOMTOM_ACCESS = "test"
# Daily TomTom calls. Can only LOWER the built-in ceiling of 600.
# 200 while only test builds use it.
DAILY_CAP = "200"
